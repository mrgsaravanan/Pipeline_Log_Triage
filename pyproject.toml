[project]
name = "pipeline-log-triage"
version = "0.1.0"
description = "Triage a failed pipeline log into distinct root causes using Claude."
requires-python = ">=3.11"
# Runtime deps; keep in sync with requirements.txt. Vercel serves only the static
# web/ folder (see vercel.json) and does not install these.
dependencies = [
    "pydantic>=2.0.0",
    "anthropic>=1.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
