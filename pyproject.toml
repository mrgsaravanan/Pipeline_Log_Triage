[project]
name = "pipeline-log-triage"
version = "0.1.0"
description = "Triage a failed pipeline log into distinct root causes using Claude."
requires-python = ">=3.11"
# Runtime deps for the hosted web app. Vercel resolves these from here (it runs
# `uv lock`, which needs this table); keep in sync with requirements.txt, which
# the Azure Docker build and local setup still use.
dependencies = [
    "pydantic>=2.0.0",
    "anthropic>=1.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# Vercel: serve the FastAPI app that lives in azure_app/main.py (module path
# form; see https://vercel.com/docs/frameworks/backend/fastapi).
[tool.vercel]
entrypoint = "azure_app.main:app"
