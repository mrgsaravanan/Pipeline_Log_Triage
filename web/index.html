<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Log Triage</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f5; --err:#c00; --line:#ccc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eee; --muted:#999; --card:#242424; --err:#ff6b6b; --line:#444; }
  }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--fg);
         max-width:800px; margin:2rem auto; padding:0 1rem; }
  textarea, input[type=text], input[type=password] { width:100%; box-sizing:border-box; background:var(--card);
         color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:.5rem; }
  textarea { height:220px; font-family:monospace; font-size:.9rem; }
  label { display:block; margin-top:1rem; font-weight:600; }
  button { padding:.5rem 1.5rem; font-size:1rem; margin-top:.75rem; cursor:pointer; }
  .failure { border-left:3px solid var(--err); padding-left:1rem; margin:1.25rem 0; }
  .notes { background:var(--card); padding:1rem; margin-top:1.5rem; border-radius:4px; }
  .error { color:var(--err); white-space:pre-wrap; }
  .muted { color:var(--muted); font-size:.85rem; }
  details { margin-top:1.5rem; }
  .badge { font-size:.75rem; padding:.05rem .45rem; border-radius:10px; border:1px solid var(--line); margin-left:.4rem; }
  .fix { background:var(--card); padding:.6rem; border-radius:4px; white-space:pre-wrap; font-family:monospace; font-size:.85rem; }
  .actions { margin-top:1rem; }
  @media print { #themebar, #go, .actions, details, textarea, label, input { display:none !important; } }
</style>
</head>
<body>
<h1>Pipeline Log Triage</h1>
<p class="muted"><a href="dashboard.html">Workflow dashboard</a> (sign in to assign, track and cost findings)</p>
<p class="muted">Runs through your own Claude subscription via a server on your machine
  (<code>python local_server.py</code>). Nothing is sent to this site's host.</p>

<label for="text">Paste log text</label>
<textarea id="text" placeholder="Paste a pipeline log..."></textarea>

<label for="file">...or upload a log file / screenshot (PNG, JPEG, GIF, WebP)</label>
<input id="file" type="file">

<button id="go">Triage</button>
<span id="status" class="muted"></span>
<div id="out"></div>

<details>
  <summary>Settings</summary>
  <label for="backend">Triage server URL</label>
  <input id="backend" type="text">
  <label for="code">Access code (or sign in below)</label>
  <input id="code" type="password" autocomplete="off">
  <label for="user">Sign in with your dashboard account</label>
  <input id="user" type="text" placeholder="username" autocomplete="username">
  <input id="pass" type="password" placeholder="password" autocomplete="current-password">
  <button id="signin" type="button">Sign in</button> <span id="signinMsg" class="muted"></span>
</details>

<script>
const DEFAULT_BACKEND = location.protocol.startsWith("http") && location.hostname.endsWith("vercel.app")
  ? "https://pipeline-log-triage-saravanan.azurewebsites.net" : "http://localhost:8000";
const MAX_IMAGE_BYTES = 4 * 1024 * 1024;
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
$("backend").value = store.get("backend", DEFAULT_BACKEND);
$("backend").addEventListener("change", () => store.set("backend", $("backend").value.trim()));
$("code").value = store.get("code", "");
$("code").addEventListener("change", () => store.set("code", $("code").value));

const session = {
  get() { try { return sessionStorage.getItem("token") || ""; } catch { return ""; } },
  set(v) { try { v ? sessionStorage.setItem("token", v) : sessionStorage.removeItem("token"); } catch {} },
};
if (session.get()) $("signinMsg").textContent = "Signed in.";
$("signin").addEventListener("click", async () => {
  $("signinMsg").textContent = "";
  try {
    const res = await fetch(location.origin + "/api/login", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("user").value.trim(), password: $("pass").value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token) throw new Error(data.detail || `Sign-in failed (${res.status})`);
    session.set(data.token);
    $("pass").value = "";
    $("signinMsg").textContent = `Signed in as ${data.full_name}.`;
  } catch (e) { $("signinMsg").textContent = e.message; }
});
function authHeaders() {
  const token = session.get();
  return token ? { Authorization: "Bearer " + token } : { "X-Access-Code": $("code").value };
}

function reportMarkdown(t) {
  const lines = ["# Pipeline log triage", ""];
  t.failures.forEach((f, i) => {
    lines.push(`## ${i + 1}. ${f.failure_type}`, "",
      `- Severity: ${f.severity || "medium"} (confidence ${Math.round((f.confidence ?? 0.5) * 100)}%)`, "",
      `**What broke:** ${f.what_broke}`, "", "**Evidence:**", "```", f.evidence, "```", "",
      `**Next step:** ${f.next_step}`, "");
    if (f.suggested_fix) lines.push("**Suggested fix (AI suggestion - review before running):**", "```", f.suggested_fix, "```", "");
  });
  if (t.notes) lines.push("## Notes", t.notes, "");
  return lines.join("\n");
}

function el(tag, attrs = {}, text = "") {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  e.textContent = text;   // textContent, never innerHTML: model output is untrusted
  return e;
}

function toBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

function isImage(b) {
  return (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) ||
         (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) ||
         (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) ||
         (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46);
}

async function buildRequest() {
  const file = $("file").files[0];
  if (!file) return { name: "(pasted text)", text: $("text").value };
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (isImage(bytes)) {
    if (bytes.length > MAX_IMAGE_BYTES) throw new Error("Image is larger than 4 MB; please shrink it.");
    return { name: file.name, image_base64: toBase64(bytes) };
  }
  const utf16 = bytes[0] === 0xff && bytes[1] === 0xfe ? "utf-16le"
              : bytes[0] === 0xfe && bytes[1] === 0xff ? "utf-16be" : null;
  if (!utf16 && bytes.subarray(0, 8192).includes(0)) {
    throw new Error("That looks like a binary file. Upload a text log or a screenshot.");
  }
  return { name: file.name, text: new TextDecoder(utf16 || "utf-8").decode(bytes) };
}

function render(t) {
  const out = $("out");
  out.replaceChildren();
  if (t.failures.length > 1) out.append(el("p", {}, `${t.failures.length} distinct failures found.`));
  t.failures.forEach((f, i) => {
    const box = el("div", { className: "failure" });
    const h = el("h3", {}, t.failures.length > 1 ? `${i + 1}. ${f.failure_type}` : f.failure_type);
    h.append(el("span", { className: "badge" },
      `${f.severity || "medium"} - ${Math.round((f.confidence ?? 0.5) * 100)}% sure`));
    box.append(h);
    for (const [label, value] of [["What broke", f.what_broke], ["Evidence", f.evidence], ["Next step", f.next_step]]) {
      const p = el("p");
      p.append(el("strong", {}, label + ": "), document.createTextNode(value));
      box.append(p);
    }
    if (f.suggested_fix) {
      box.append(el("p", {}, "Suggested fix (an AI suggestion - review before running):"),
                 el("div", { className: "fix" }, f.suggested_fix));
    }
    out.append(box);
  });
  if (t.notes) out.append(el("div", { className: "notes" }, "Notes: " + t.notes));
  const actions = el("div", { className: "actions" });
  const dl = el("button", { type: "button" }, "Download report (.md)");
  dl.addEventListener("click", () => {
    const a = el("a", { href: URL.createObjectURL(new Blob([reportMarkdown(t)], { type: "text/markdown" })),
                        download: "triage-report.md" });
    a.click(); URL.revokeObjectURL(a.href);
  });
  const pr = el("button", { type: "button" }, "Print / save as PDF");
  pr.addEventListener("click", () => window.print());
  actions.append(dl, " ", pr);
  out.append(actions);
}

$("go").addEventListener("click", async () => {
  const out = $("out"), status = $("status"), btn = $("go");
  out.replaceChildren();
  btn.disabled = true;
  status.textContent = "Triaging...";
  try {
    const body = await buildRequest();
    if (!body.image_base64 && !body.text.trim()) throw new Error("No log content provided.");
    const base = $("backend").value.trim().replace(/\/$/, "");
    let res;
    try {
      res = await fetch(base + "/api/triage", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify(body),
      });
    } catch {
      throw new Error(`Could not reach the triage server at ${base}.`);
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Server error (${res.status})`);
    render(data);
  } catch (e) {
    out.append(el("p", { className: "error" }, e.message));
  } finally {
    btn.disabled = false;
    status.textContent = "";
  }
});
</script>
<style>
  #themebar { position:fixed; top:.5rem; right:.75rem; display:flex; gap:.4rem; align-items:center;
              font-size:.8rem; color:var(--muted); }
  #themebar input { width:2rem; height:1.6rem; padding:0; border:1px solid var(--line); background:none; cursor:pointer; }
  #themebar button { font-size:.75rem; padding:.15rem .5rem; margin:0; }
</style>
<div id="themebar">Background <input id="bgpick" type="color" value="#ffffff" aria-label="Background colour">
  <button id="bgreset" type="button">Reset</button></div>
<script>
(function () {
  const KEY = "theme_bg", root = document.documentElement.style;
  const get = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
  const set = (v) => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} };
  function apply(hex) {
    if (!hex) { ["--bg", "--fg", "--card", "--line", "--muted"].forEach((p) => root.removeProperty(p)); return; }
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const light = (0.299 * r + 0.587 * g + 0.114 * b) > 150;
    const mix = (t, a) => "#" + [r, g, b].map((c) => Math.round(c + (t - c) * a).toString(16).padStart(2, "0")).join("");
    root.setProperty("--bg", hex);
    root.setProperty("--fg", light ? "#1a1a1a" : "#eeeeee");
    root.setProperty("--muted", light ? "#555555" : "#aaaaaa");
    root.setProperty("--card", mix(light ? 0 : 255, 0.06));
    root.setProperty("--line", mix(light ? 0 : 255, 0.2));
  }
  const pick = document.getElementById("bgpick"), saved = get();
  if (saved) { pick.value = saved; apply(saved); }
  pick.addEventListener("input", () => { apply(pick.value); set(pick.value); });
  document.getElementById("bgreset").addEventListener("click", () => { set(null); apply(null); pick.value = "#ffffff"; });
})();
</script>
</body>
</html>
