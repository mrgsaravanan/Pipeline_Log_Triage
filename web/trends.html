<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trends and cost</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f5; --err:#c00; --line:#ccc; --accent:#2a78d6;
          --c1:#2a78d6; --c2:#e8590c; --c3:#2f9e44; --c4:#ae3ec9;
          --c5:#d6336c; --c6:#0c8599; --c7:#f08c00; --c8:#5f3dc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eee; --muted:#999; --card:#242424; --err:#ff6b6b; --line:#444; --accent:#3987e5;
            --c1:#4c9aff; --c2:#ff8a4c; --c3:#51cf66; --c4:#d17cf0;
            --c5:#ff6b9d; --c6:#3bc9db; --c7:#ffc233; --c8:#9b87f5; }
  }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--fg);
         max-width:1100px; margin:2rem auto; padding:0 1rem; }
  input { background:var(--card); color:var(--fg); border:1px solid var(--line);
         border-radius:4px; padding:.4rem; font:inherit; box-sizing:border-box; }
  button { padding:.4rem 1rem; cursor:pointer; font:inherit; }
  label { display:block; font-weight:600; margin:.6rem 0 .2rem; font-size:.85rem; }
  .muted { color:var(--muted); font-size:.85rem; }
  .error { color:var(--err); white-space:pre-wrap; }
  h1 { background:linear-gradient(90deg, var(--c1), var(--c4), var(--c5)); -webkit-background-clip:text;
       background-clip:text; -webkit-text-fill-color:transparent; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
  .login { max-width:320px; margin:4rem auto; }
  .login input { width:100%; }
  .trends { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1rem; margin:1rem 0; }
  .trends > div { background:var(--card); padding:.75rem 1rem 1rem; border-radius:8px;
                  border-top:4px solid var(--tone, var(--accent));
                  box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .trends > div:nth-child(1) { --tone:var(--c1); }
  .trends > div:nth-child(2) { --tone:var(--c4); }
  .trends > div:nth-child(3) { --tone:var(--c2); }
  .trends > div:nth-child(4) { --tone:var(--c3); }
  .trends > div:nth-child(5) { --tone:var(--c5); }
  .trends h3 { margin:0 0 .6rem; font-size:.95rem; color:var(--tone, var(--fg)); }
  .chart-empty { color:var(--muted); font-size:.85rem; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .chart .bar-mark, .chart .col-mark { fill:var(--tone, var(--accent)); }
  .chart .fill1 { fill:var(--c1) !important; } .chart .fill2 { fill:var(--c2) !important; }
  .chart .fill3 { fill:var(--c3) !important; } .chart .fill4 { fill:var(--c4) !important; }
  .chart .fill5 { fill:var(--c5) !important; } .chart .fill6 { fill:var(--c6) !important; }
  .chart .fill7 { fill:var(--c7) !important; } .chart .fill8 { fill:var(--c8) !important; }
  .chart .bar-row:hover .bar-mark, .chart .bar-row:focus .bar-mark,
  .chart .col-col:hover .col-mark, .chart .col-col:focus .col-mark { opacity:.75; }
  .chart .bar-row, .chart .col-col { outline:none; cursor:default; }
  .chart .axis-line { stroke:var(--line); stroke-width:1; shape-rendering:crispEdges; }
  .chart .cat-label { fill:var(--fg); font-size:11px; }
  .chart .value-label { fill:var(--muted); font-size:11px; }
  /* Hero figure: mean time to resolve */
  .hero { display:flex; flex-direction:column; align-items:flex-start; gap:.15rem; padding-top:.25rem; }
  .hero b { font-size:2.6rem; font-weight:700; line-height:1; color:var(--tone);
            background:linear-gradient(90deg, var(--c3), var(--c6)); -webkit-background-clip:text;
            background-clip:text; -webkit-text-fill-color:transparent; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<section id="loginView" class="login" hidden>
  <h1>Trends and cost</h1>
  <label for="user">Username</label>
  <input id="user" autocomplete="username">
  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <p><button id="loginBtn">Sign in</button></p>
  <p id="loginErr" class="error"></p>
  <p class="muted"><a href="index.html">Home</a> &middot; <a href="dashboard.html">Workflow dashboard</a></p>
</section>

<section id="appView" hidden>
  <header>
    <h1>Trends and cost</h1>
    <div><span id="who" class="muted"></span> <button id="logoutBtn">Sign out</button>
      &nbsp;<a href="index.html">Home</a> &middot; <a href="dashboard.html">Workflow dashboard</a></div>
  </header>
  <p id="trendsErr" class="error"></p>
  <div class="trends" id="trends"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";
// Same server that serves this page by default.
const BACKEND = location.protocol.startsWith("http") ? "" : "http://localhost:8000";

let me = null;

async function api(path, opts = {}) {
  const res = await fetch(BACKEND + path, {
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error((body && body.detail) || `request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}

// textContent only: finding text (categories, team names, failure titles) comes
// from a model reading arbitrary logs, so it is untrusted for innerHTML.
function el(tag, text = "", cls = "") {
  const e = document.createElement(tag);
  e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function svgEl(tag, attrs = {}) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const money = (n) => n == null ? "-" : "$" + Number(n).toFixed(0);

function show(view) {
  $("loginView").hidden = view !== "login";
  $("appView").hidden = view !== "app";
}

async function login() {
  $("loginErr").textContent = "";
  try {
    me = await api("/api/login", { method: "POST",
      body: JSON.stringify({ username: $("user").value, password: $("pass").value }) });
    $("pass").value = "";
    await start();
  } catch (e) { $("loginErr").textContent = e.message; }
}

async function start() {
  $("who").textContent = `${me.full_name} (${me.role}, ${me.team_name})`;
  show("app");
  await loadTrends();
}

// Horizontal ranking bar chart: one row per record, bar grows right from a
// left baseline, value labelled at the tip (every bar - there are only a
// handful of rows per chart, so labelling all of them is the readable choice).
function hBarChart(rows, labelKey, valueKey, fmt = (v) => String(v)) {
  const box = document.createElement("div");
  box.className = "chart";
  if (!rows.length) { box.append(el("span", "No data yet.", "chart-empty")); return box; }

  const W = 480, labelW = 132, rightPad = 56, rowH = 28, barH = 20, topPad = 4;
  const barAreaW = W - labelW - rightPad;
  const H = topPad * 2 + rows.length * rowH;
  const max = Math.max(1, ...rows.map((r) => Number(r[valueKey]) || 0));

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `Bar chart of ${valueKey} by ${labelKey}` });
  svg.append(svgEl("line", { class: "axis-line", x1: labelW, y1: 0, x2: labelW, y2: H }));

  rows.forEach((r, i) => {
    const y = topPad + i * rowH;
    const value = Number(r[valueKey]) || 0;
    const w = Math.max(2, (value / max) * barAreaW);
    const label = String(r[labelKey] ?? "");
    const g = svgEl("g", { class: "bar-row", tabindex: "0" });
    const barY = y + (rowH - barH) / 2;
    g.append(svgEl("rect", {
      class: "bar-mark fill" + ((i % 8) + 1), x: labelW, y: barY, width: w, height: barH, rx: 4, ry: 4,
    }));
    const labelText = svgEl("text", {
      class: "cat-label", x: labelW - 8, y: y + rowH / 2, "text-anchor": "end",
      "dominant-baseline": "middle",
    });
    labelText.textContent = label.length > 22 ? label.slice(0, 21) + "…" : label;
    const valueText = svgEl("text", {
      class: "value-label", x: labelW + w + 8, y: y + rowH / 2, "text-anchor": "start",
      "dominant-baseline": "middle",
    });
    valueText.textContent = fmt(value);
    const title = svgEl("title", {});
    title.textContent = `${label}: ${fmt(value)}`;
    g.append(labelText, valueText, title);
    svg.append(g);
  });
  box.append(svg);
  return box;
}

// Vertical column chart for a short weekly time series: columns grow up from
// a shared baseline, week label below, value labelled on the cap.
function vColChart(rows, labelKey, valueKey) {
  const box = document.createElement("div");
  box.className = "chart";
  if (!rows.length) { box.append(el("span", "No data yet.", "chart-empty")); return box; }

  const W = 480, H = 160, leftPad = 8, rightPad = 8, bottomPad = 22, topPad = 20;
  const plotW = W - leftPad - rightPad, plotH = H - topPad - bottomPad;
  const colW = Math.min(28, plotW / rows.length - 8);
  const step = plotW / rows.length;
  const max = Math.max(1, ...rows.map((r) => Number(r[valueKey]) || 0));
  const baseline = H - bottomPad;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `Column chart of ${valueKey} by ${labelKey}` });
  svg.append(svgEl("line", { class: "axis-line", x1: leftPad, y1: baseline, x2: W - rightPad, y2: baseline }));

  rows.forEach((r, i) => {
    const value = Number(r[valueKey]) || 0;
    const h = Math.max(2, (value / max) * plotH);
    const cx = leftPad + step * i + step / 2;
    const x = cx - colW / 2;
    const label = String(r[labelKey] ?? "");
    const g = svgEl("g", { class: "col-col", tabindex: "0" });
    g.append(svgEl("rect", {
      class: "col-mark", x, y: baseline - h, width: colW, height: h, rx: 4, ry: 4,
    }));
    const valueText = svgEl("text", {
      class: "value-label", x: cx, y: baseline - h - 6, "text-anchor": "middle",
    });
    valueText.textContent = String(value);
    const labelText = svgEl("text", {
      class: "cat-label", x: cx, y: baseline + 14, "text-anchor": "middle",
    });
    labelText.textContent = label;
    const title = svgEl("title", {});
    title.textContent = `Week of ${label}: ${value} finding(s)`;
    g.append(valueText, labelText, title);
    svg.append(g);
  });
  box.append(svg);
  return box;
}

function statTile(value) {
  const box = document.createElement("div");
  box.className = "hero";
  box.append(el("b", value));
  box.append(el("span", "Mean time to resolve", "muted"));
  return box;
}

async function loadTrends() {
  $("trendsErr").textContent = "";
  try {
    const t = await api("/api/trends");
    const section = (title, body) => {
      const d = document.createElement("div");
      d.append(el("h3", title), body);
      return d;
    };
    $("trends").replaceChildren(
      section("Findings per week", vColChart(t.weekly, "week", "findings")),
      section("By category", hBarChart(t.categories, "category", "findings")),
      section("Estimated cost by team", hBarChart(t.team_cost, "team", "estimated_cost", money)),
      section("Mean time to resolve",
        statTile(t.mttr_hours == null ? "–" : `${t.mttr_hours}h`)),
      section("Recurring failures", hBarChart(t.repeats, "title", "occurrences", (v) => v + "x")));
  } catch (e) {
    if (e.status === 401) return show("login");
    $("trendsErr").textContent = e.message;
  }
}

$("loginBtn").addEventListener("click", login);
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("logoutBtn").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch {}
  me = null; show("login");
});

(async () => {
  try { me = await api("/api/me"); await start(); }
  catch (e) { show("login"); if (e.status === 503) $("loginErr").textContent = e.message; }
})();
</script>
</body>
</html>
